name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate skill scaffold
        run: python3 project-readiness-auditor/scripts/validate_skill.py project-readiness-auditor

      - name: Validate local agent pack
        run: python3 scripts/validate_pack.py .

      - name: Run validator tests
        run: python3 -m unittest discover -s tests

      - name: Validate public report examples
        run: python3 project-readiness-auditor/scripts/validate_skill.py project-readiness-auditor --strict-report-quality --public-report-examples --report-quality-summary

      - name: Install-smoke skill package
        run: python3 project-readiness-auditor/scripts/install_smoke.py .

      - name: Check whitespace
        run: git diff --check
